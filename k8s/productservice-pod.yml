apiVersion: apps/v1
kind: Deployment
metadata:
  name: productservice-deployment
  labels:
    app: productservice
spec:
  replicas: 3
  selector:
    matchLabels:
      app: productservice
  template:
    metadata:
      labels:
        app: productservice
    spec:
      containers:
      - name: productservice
        image: hardingtrutran/productservice:latest
        ports:
        - containerPort: 8083
        envFrom:
          - configMapRef:
              name: h2console-cm
          - configMapRef:
              name: axon-cm
        env:
          - name: DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: h2console-secret
                key: DATABASE_PASSWORD