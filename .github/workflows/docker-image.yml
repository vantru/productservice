name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  call-build:
    uses: vantru/shared-workflows/.github/workflows/docker-build.yml@main
    with:
      image_name: ordersservice
      context: .
    secrets: inherit
    
  
  update-k8s:
    needs:
      - call-build
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: install yd
        uses: mikefarah/yq@v4.44.3
      - name: update kubernetes mainfest
        run: |
          FILE=./k8s/productservice-pod.yml
          yq -i '(select(.kind == "Deployment") | .spec.template.spec.containers[0].image) = "hardingtrutran/productservice:${{ needs.call-build.outputs.short_sha }}"' "$FILE"
      - name: commit deployment product service file change
        run: |
          git config --global user.email "vantruit@gmail.com"
          git config --global user.name "vantru"
          git add k8s/productservice-pod.yml
          git commit -m "change tag sha"
          git push origin main